name: verify all implementations

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Target OS to run (or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - ubuntu-24.04
          - macos-latest
          - windows-latest
      lang:
        description: 'Specific language(s) to run (comma-separated, e.g. lua or lua,prolog, or all)'
        required: false
        default: 'all'
        type: string
  push:
    paths:
      - 'sha257/**'
  pull_request:
    paths:
      - 'sha257/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (inputs.os && inputs.os != 'all') && fromJSON(format('["{0}"]', inputs.os)) || fromJSON('["ubuntu-24.04", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      # --- language runtimes (cross-platform) ---

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.x'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          windows-toolchain: none

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: latest
          cabal-update: false

      - uses: dtolnay/rust-toolchain@stable

      - name: setup swift (linux only — pre-installed on macos, n/a on windows)
        uses: swift-actions/setup-swift@v2
        if: runner.os == 'Linux'

      - name: install ts-node & coffeescript
        run: npm install -g ts-node typescript@^5 coffeescript

      - name: install kotlin
        env:
          KOTLIN_VERSION: '2.0.21'
        run: |
          curl -fsSL "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" -o kotlin.zip
          unzip -q kotlin.zip -d "$RUNNER_TEMP/kotlin"
          echo "$RUNNER_TEMP/kotlin/kotlinc/bin" >> "$GITHUB_PATH"

      # --- os-specific package installs ---

      - name: install tools (ubuntu)
        if: runner.os == 'Linux'
        run: |
          # Probe candidate Ubuntu mirrors in parallel and rank by download speed
          source /etc/os-release
          PROBE_PATH="dists/${VERSION_CODENAME}/main/binary-amd64/Packages.gz"
          CANDIDATES=(
            "http://azure.archive.ubuntu.com/ubuntu"
            "http://us-east-1.ec2.archive.ubuntu.com/ubuntu"
            "http://us-east-2.ec2.archive.ubuntu.com/ubuntu"
            "http://us-west-1.ec2.archive.ubuntu.com/ubuntu"
            "http://us-west-2.ec2.archive.ubuntu.com/ubuntu"
            "http://us.archive.ubuntu.com/ubuntu"
            "http://archive.ubuntu.com/ubuntu"
          )
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            while IFS= read -r m; do
              m="${m%%[[:space:]]*}"
              if [[ -n "$m" && "$m" != \#* ]]; then
                CANDIDATES+=("${m%/}")
              fi
            done < /etc/apt/apt-mirrors.txt
          fi
          mapfile -t CANDIDATES < <(printf '%s\n' "${CANDIDATES[@]}" | awk '!seen[$0]++')

          PROBE_DIR=$(mktemp -d)
          for i in "${!CANDIDATES[@]}"; do
            m="${CANDIDATES[$i]}"
            (
              out=$(curl -fsS --connect-timeout 2 --max-time 4 -o /dev/null -w '%{http_code} %{size_download} %{speed_download}' "${m}/${PROBE_PATH}" 2>/dev/null) || out="0 0 0"
              read -r code size speed <<< "$out"
              if [[ "$code" == "200" && "${size%%.*}" -gt 100000 ]]; then
                printf '%s %s\n' "${speed%%.*}" "$m" > "${PROBE_DIR}/${i}"
              fi
            ) &
          done
          wait

          RANKED=$(cat "${PROBE_DIR}"/* 2>/dev/null | awk '$1+0 > 0' | sort -rn || true)
          rm -rf "$PROBE_DIR"
          if [[ -n "$RANKED" ]]; then
            echo "Ubuntu mirror speeds (bytes/s):"
            echo "$RANKED"
            BEST_MIRROR=$(awk 'NR==1 {print $2}' <<< "$RANKED")
            if [[ -f /etc/apt/apt-mirrors.txt ]]; then
              awk '{printf "%s\tpriority:%d\n", $2, NR}' <<< "$RANKED" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            elif [[ -f /etc/apt/sources.list.d/ubuntu.sources ]]; then
              sudo sed -i -E "s|^URIs: https?://[^ ]*archive\.ubuntu\.com/ubuntu/?|URIs: ${BEST_MIRROR}|" /etc/apt/sources.list.d/ubuntu.sources
            fi
          fi

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gfortran gnat gnucobol swi-prolog-nox lua5.4 php-cli octave \
            file ksh wget gdc fp-compiler nim crystal libgc-dev libevent-dev \
            sbcl elixir clojure tcl yabasic nasm iverilog gforth
          sudo ln -sf /usr/bin/lua5.4 /usr/local/bin/lua
          # Install PowerShell (only if not already pre-installed on runner)
          if ! command -v pwsh &>/dev/null; then
            wget -q "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb"
            sudo dpkg -i packages-microsoft-prod.deb
            rm packages-microsoft-prod.deb
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends powershell
          fi
          # Install YottaDB (MUMPS)
          mkdir /tmp/ydb && cd /tmp/ydb
          wget https://gitlab.com/YottaDB/DB/YDB/raw/master/sr_unix/ydbinstall.sh
          chmod +x ydbinstall.sh
          sudo ./ydbinstall.sh --utf8 default
          # Find the installation directory (e.g., /usr/local/lib/yottadb/r206)
          YDB_DIR=$(ls -d /usr/local/lib/yottadb/r* | head -n 1)
          sudo ln -sf "$YDB_DIR/mumps" /usr/local/bin/mumps
          sudo ln -sf "$YDB_DIR/yottadb" /usr/local/bin/yottadb
          # Install Zig
          curl -L https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o zig.tar.xz
          tar -xJf zig.tar.xz
          sudo mv zig-linux-x86_64-0.13.0 /usr/local/zig
          sudo ln -s /usr/local/zig/zig /usr/local/bin/zig
          # Install Julia
          curl -L https://julialang-s3.julialang.org/bin/linux/x64/1.10/julia-1.10.4-linux-x86_64.tar.gz -o julia.tar.gz
          tar -xzf julia.tar.gz
          sudo mv julia-1.10.4 /usr/local/julia
          sudo ln -s /usr/local/julia/bin/julia /usr/local/bin/julia

      - name: install tools (macos)
        if: runner.os == 'macOS'
        run: |
          brew install lua swi-prolog gcc php icarus-verilog gforth
          # gcc provides versioned gfortran (e.g. gfortran-14) — create bare symlink
          gf=$(ls /opt/homebrew/bin/gfortran-* 2>/dev/null | sort -V | tail -1)
          if [[ -n "$gf" ]]; then ln -sf "$gf" /opt/homebrew/bin/gfortran; fi
          # tclsh is pre-installed on macOS, but fall back to homebrew tcl-tk if absent
          if ! command -v tclsh &>/dev/null; then
            brew install tcl-tk
            echo "$(brew --prefix tcl-tk)/bin" >> "$GITHUB_PATH"
          fi
          # php was removed from macOS 12+; swiftc/ksh/perl are pre-installed
          # gnat excluded: arm64 homebrew support uncertain

      - name: install tools (windows)
        if: runner.os == 'Windows'
        run: |
          # gcc/g++/gfortran from mingw64 (pre-installed); php pre-installed on runner
          # lua53 provides 5.3+ bitwise operators used in sha257sum.lua (choco 'lua' may default to 5.1)
          choco install -y lua53 swi-prolog --no-progress || choco install -y lua swi-prolog --no-progress
          # lua53 deploys to chocolatey/lib/lua53/tools without a bin shim; swi-prolog installs to Program Files/swipl/bin
          echo "C:/ProgramData/chocolatey/lib/lua53/tools" >> "$GITHUB_PATH"
          echo "C:/Program Files/swipl/bin" >> "$GITHUB_PATH"
          echo "C:/ProgramData/chocolatey/bin" >> "$GITHUB_PATH"
          # Ensure python3 alias exists on Windows if only python.exe is present
          if ! command -v python3 &>/dev/null && command -v python &>/dev/null; then
            cp "$(command -v python)" "$(dirname "$(command -v python)")/python3.exe"
          fi
          # gnat not available — ada test will be skipped on windows

      # --- declare which langs must pass (skip = failure for these) ---

      - name: set required langs (ubuntu)
        if: runner.os == 'Linux'
        run: |
          echo "MUST_RUN=c,c++,fortran,ada,rust,swift,haskell,java,kotlin,go,node.js,typescript,coffeescript,python,ruby,perl,php,lua,c#,f#,tcl,basic,forth,x86 assembly,verilog,bash/awk,ksh,powershell,prolog,octave,mumps,cobol,d,zig,nim,pascal,julia,crystal,common lisp,elixir,clojure" >> "$GITHUB_ENV"

      - name: set required langs (macos)
        if: runner.os == 'macOS'
        run: |
          # ksh/tclsh are pre-installed on macos runners; ada/mumps/octave excluded
          echo "MUST_RUN=c,c++,fortran,rust,swift,haskell,java,kotlin,go,node.js,typescript,coffeescript,python,ruby,perl,php,lua,c#,f#,tcl,forth,verilog,bash/awk,ksh,powershell,prolog" >> "$GITHUB_ENV"

      - name: set required langs (windows)
        if: runner.os == 'Windows'
        run: |
          # swift/ada/ksh/mumps/tcl: not conveniently available on windows — genuinely excluded
          echo "MUST_RUN=c,c++,fortran,rust,haskell,java,kotlin,go,node.js,typescript,coffeescript,python,ruby,perl,php,lua,c#,f#,bash/awk,powershell,prolog" >> "$GITHUB_ENV"

      # --- run it ---

      - name: run tests
        env:
          ONLY_RUN: ${{ inputs.lang || 'all' }}
        run: bash test.sh
